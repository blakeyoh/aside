name: Native release rehearsal

# Manual dry-run for the native SwiftUI distribution path.
# This is the rehearsal for the only publishable release path. The separate
# release-rehearsal.yml workflow is legacy py2app compatibility evidence and
# must not be used to approve a release.

on:
  workflow_dispatch:

jobs:
  rehearsal-swiftui:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: brew install python@3.13 python-tk@3.13 portaudio create-dmg

      - name: Set up Python environment
        run: |
          python3.13 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "setuptools<70" wheel
          .venv/bin/pip install "py2app==0.28.10" "huggingface_hub>=0.20"
          .venv/bin/pip install -e .
          .venv/bin/pip install "pytest>=8"
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v

      - name: Build SwiftUI Aside.app
        env:
          MODEL_REVISION: ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66
        run: |
          source .venv/bin/activate
          scripts/build_swiftui_app.sh release

      - name: Verify SwiftUI bundle before signing
        run: |
          source .venv/bin/activate
          scripts/verify_swiftui_bundle.sh dist-swiftui/Aside.app

      - name: Codesign SwiftUI app
        run: |
          codesign --deep --force --sign - \
            --entitlements entitlements.plist dist-swiftui/Aside.app

      - name: Verify signed SwiftUI bundle
        run: |
          source .venv/bin/activate
          scripts/verify_swiftui_bundle.sh --codesign dist-swiftui/Aside.app

      - name: Smoke-launch SwiftUI bundle with embedded helper
        run: |
          source .venv/bin/activate
          scripts/smoke_swiftui_launch.sh --app dist-swiftui/Aside.app

      - name: Package SwiftUI DMG
        run: |
          source .venv/bin/activate
          scripts/package_swiftui_dmg.sh

      - name: Verify SwiftUI DMG
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=( dist-swiftui/Aside-SwiftUI-*.dmg )
          test "${#DMGS[@]}" -eq 1
          DMG="${DMGS[0]}"
          echo "DMG: $DMG"
          hdiutil verify "$DMG"
          MOUNT=$(hdiutil attach "$DMG" -nobrowse -readonly | tail -1 | awk '{print $3}')
          echo "Mounted at: $MOUNT"
          scripts/verify_swiftui_bundle.sh --codesign "$MOUNT/Aside.app"
          hdiutil detach "$MOUNT"

      - name: Confirm SwiftUI DMG name matches src/aside __version__
        run: |
          set -euo pipefail
          PYVER=$(python -c "import sys; sys.path.insert(0,'src'); from aside import __version__; print(__version__)")
          DMG_NAME=$(basename dist-swiftui/Aside-SwiftUI-*.dmg)
          echo "src/aside/__init__.py __version__ = $PYVER"
          echo "DMG filename                       = $DMG_NAME"
          test "$DMG_NAME" = "Aside-SwiftUI-${PYVER}.dmg"

      - name: Upload SwiftUI DMG as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aside-SwiftUI-rehearsal-dmg
          path: dist-swiftui/Aside-SwiftUI-*.dmg
          if-no-files-found: error
          retention-days: 14
