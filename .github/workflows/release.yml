name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: macos-14  # Apple Silicon — matches arm64-only build target
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        # python-tk@3.13 supplies _tkinter for Homebrew python@3.13.
        # Keep the version in lockstep with SUPPORTED_PYTHONS in setup.sh.
        run: brew install python@3.13 python-tk@3.13 portaudio create-dmg

      - name: Set up Python environment
        run: |
          python3.13 -m venv .venv
          .venv/bin/pip install --upgrade pip
          # Pin setuptools < 70 so py2app 0.28 (the latest release) can run.
          # Newer setuptools removed the legacy `install_requires` keyword
          # that py2app's build_app reads; the build aborts with
          # `error: install_requires is no longer supported` without this pin.
          .venv/bin/pip install "setuptools<70" wheel
          .venv/bin/pip install "py2app==0.28.10" "huggingface_hub>=0.20"
          .venv/bin/pip install -e .
          # Make the venv's python the default for all subsequent steps
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Confirm tag matches src/aside/__version__
        # Fail fast if someone tags a version that doesn't match the source.
        # Otherwise package_dmg.sh would produce Aside-<__version__>.dmg
        # and the release-upload glob below would not find an "Aside-<tag>.dmg".
        run: |
          PYVER=$(python -c "import sys; sys.path.insert(0,'src'); from aside import __version__; print(__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag (without v)               = $TAG"
          echo "src/aside/__init__.py version = $PYVER"
          test "$TAG" = "$PYVER"

      - name: Build Aside.app
        # MODEL_REVISION is pinned in source so release artifacts are
        # byte-reproducible and bumps go through code review. To bump:
        #   1. git ls-remote https://huggingface.co/Systran/faster-whisper-base main
        #   2. Replace the value below with the new 40-char SHA
        #   3. Open a PR — release-rehearsal.yml will verify the bundle before tagging
        env:
          MODEL_REVISION: ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66
        run: scripts/build_app.sh release

      - name: Codesign
        # Uses ad-hoc identity (-) until Apple Developer enrollment is complete.
        # After enrollment: add a CODESIGN_IDENTITY repository secret containing
        # your Developer ID Application certificate name, then change "-" below to
        # "${{ secrets.CODESIGN_IDENTITY }}".
        run: |
          codesign --deep --force --sign - \
            --entitlements entitlements.plist dist/Aside.app

      # ── Notarization — uncomment after Apple Developer enrollment ─────────
      #
      # Required secrets (Settings → Secrets → Actions):
      #   APPLE_ID          your Apple ID email
      #   APPLE_TEAM_ID     10-character team ID from developer.apple.com
      #   NOTARIZE_PASSWORD app-specific password from appleid.apple.com
      #   CODESIGN_IDENTITY "Developer ID Application: Your Name (TEAMID)"
      #
      # Also change the Codesign step above to use ${{ secrets.CODESIGN_IDENTITY }}.
      #
      # - name: Notarize
      #   env:
      #     APPLE_ID:          ${{ secrets.APPLE_ID }}
      #     APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
      #     NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
      #   run: |
      #     xcrun notarytool submit dist/Aside.app \
      #       --apple-id       "$APPLE_ID" \
      #       --team-id        "$APPLE_TEAM_ID" \
      #       --password       "$NOTARIZE_PASSWORD" \
      #       --wait
      #     xcrun stapler staple dist/Aside.app
      #
      # ─────────────────────────────────────────────────────────────────────

      - name: Package DMG
        run: scripts/package_dmg.sh

      - name: Confirm exactly one DMG was produced
        # Fails the release before the upload step if package_dmg.sh wrote a
        # differently-named file (or none at all) — otherwise the upload glob
        # would silently match nothing and produce an empty GitHub Release.
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=( dist/Aside-*.dmg )
          test "${#DMGS[@]}" -eq 1
          echo "Found release artifact: ${DMGS[0]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Aside-*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
